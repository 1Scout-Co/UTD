name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Mặc định chỉ đọc. Riêng job release xin quyền ghi để tạo bản phát hành nháp.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Không đặt `version`: action đọc "packageManager" (pnpm@12.9.1) trong package.json.
      # pnpm 12 cần action-setup >= v6.1.0 (tag v6 chưa trỏ tới bản này).
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p utd-engine
      - run: cargo test -p utd-mp4
      - run: cargo test -p app --lib
      - run: cargo clippy -p utd-engine --all-targets -- -D warnings
      - run: cargo clippy -p utd-mp4 --all-targets -- -D warnings
      - run: cargo clippy -p app --all-targets -- -D warnings
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test

  # Phần Rust chạy riêng trên macOS (Finder, Thùng rác, icon, Unix socket, cờ quarantine…).
  # Giao diện web giống hệt Windows nên lint/build/Playwright chỉ chạy ở job trên.
  test-macos:
    runs-on: macos-latest
    env:
      # rust-toolchain.toml ghim MSVC cho Windows; macOS dùng stable của máy.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo test -p utd-engine
      - run: cargo test -p utd-mp4
      - run: cargo test -p app --lib
      - run: cargo clippy -p utd-engine --all-targets -- -D warnings
      - run: cargo clippy -p utd-mp4 --all-targets -- -D warnings
      - run: cargo clippy -p app --all-targets -- -D warnings

  # Chạy khi đẩy tag vX.Y.Z (cách làm: docs/RELEASE.md): kiểm một lần, dựng Windows và macOS song song,
  # rồi job `release` gộp latest.json (tự cập nhật cả hai nền tảng) và tạo bản nháp.
  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tag matches app version
        shell: bash
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$app_version" != "$GITHUB_REF_NAME" ] || [ "$cargo_version" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, tauri.conf.json ($app_version) và Cargo.toml gốc ($cargo_version) phải cùng số"
            exit 1
          fi

      # Khoá ký bản cập nhật (minisign, KHÁC ký mã Windows/Apple): chủ dự án tự thêm 2 secret (docs/RELEASE.md → Tự cập nhật).
      # Một khoá dùng cho cả Windows và macOS. Kiểm trước khi dựng để báo lỗi sớm và rõ.
      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_KEY_NO_PASSWORD: ${{ vars.UPDATER_KEY_NO_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Thiếu secret TAURI_SIGNING_PRIVATE_KEY (khoá ký bản cập nhật). Cách thêm: docs/RELEASE.md, mục Tự cập nhật"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && [ "$UPDATER_KEY_NO_PASSWORD" != "true" ]; then
            echo "::error::Thiếu secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD (mật khẩu của khoá). Khoá tạo không đặt mật khẩu thì đặt biến repo UPDATER_KEY_NO_PASSWORD=true"
            exit 1
          fi
          echo "Đã có khoá ký bản cập nhật"

  build-windows:
    needs: release-check
    runs-on: windows-latest
    env:
      BUNDLE_DIR: target/release/bundle/nsis
      OUT_DIR: release-windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile

      # Ký mã: TẮT mặc định. Bật = biến repo WINDOWS_SIGNING=true + secret WINDOWS_SIGN_COMMAND
      # (lệnh ký, %1 là file cần ký). Tauri gọi lệnh này cho UTD.exe, uninstall.exe và bộ cài (docs/RELEASE.md).
      - name: Configure code signing (optional)
        if: vars.WINDOWS_SIGNING == 'true'
        shell: bash
        env:
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          if [ -z "$WINDOWS_SIGN_COMMAND" ]; then
            echo "::error::WINDOWS_SIGNING=true nhưng chưa có secret WINDOWS_SIGN_COMMAND"
            exit 1
          fi
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ bundle: { windows: { signCommand: process.env.WINDOWS_SIGN_COMMAND } } }))' "$RUNNER_TEMP/signing.conf.json"
          echo "TAURI_EXTRA_CONFIG=$RUNNER_TEMP/signing.conf.json" >> "$GITHUB_ENV"

      - name: Build NSIS installer
        shell: bash
        env:
          # Chỉ truyền khi bật ký (Azure Trusted Signing đọc 3 biến này); tắt thì là chuỗi rỗng.
          AZURE_CLIENT_ID: ${{ vars.WINDOWS_SIGNING == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ vars.WINDOWS_SIGNING == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ vars.WINDOWS_SIGNING == 'true' && secrets.AZURE_TENANT_ID || '' }}
          # Tauri ký bộ cài cho updater (tạo thêm file .sig) bằng khoá này; khoá không khớp pubkey thì CLI cảnh báo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # tauri.updater.conf.json bật createUpdaterArtifacts chỉ ở CI: dựng trên máy không cần khoá.
          args=(--bundles nsis --config "$GITHUB_WORKSPACE/src-tauri/tauri.updater.conf.json")
          if [ -n "${TAURI_EXTRA_CONFIG:-}" ]; then
            args+=(--config "$TAURI_EXTRA_CONFIG")
          fi
          pnpm tauri build "${args[@]}"

      # Tên bộ cài đổi theo version nên tìm bằng mẫu, không ghi cứng.
      - name: Collect Windows files
        shell: bash
        run: |
          shopt -s nullglob
          installers=("$BUNDLE_DIR"/*-setup.exe)
          if [ ${#installers[@]} -ne 1 ]; then
            echo "::error::Cần đúng 1 bộ cài trong $BUNDLE_DIR, thấy ${#installers[@]}"
            exit 1
          fi
          if [ ! -f "${installers[0]}.sig" ]; then
            echo "::error::Không thấy ${installers[0]}.sig: bộ cài chưa được ký cho tự cập nhật"
            exit 1
          fi
          mkdir -p "$OUT_DIR"
          cp "${installers[0]}" "${installers[0]}.sig" "$OUT_DIR/"
          ls -l "$OUT_DIR"

      - uses: actions/upload-artifact@v7
        with:
          name: build-windows
          path: ${{ env.OUT_DIR }}/
          if-no-files-found: error

  # Một bản "universal" chạy cả Mac chip Apple (M1…) lẫn Mac Intel. Chưa có tài khoản Apple Developer
  # nên chỉ ký ad-hoc (tauri.macos.conf.json), không notarize: lần đầu người dùng mở theo docs/RELEASE.md.
  build-macos:
    needs: release-check
    runs-on: macos-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      BUNDLE_DIR: target/universal-apple-darwin/release/bundle
      OUT_DIR: release-macos
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile

      - name: Build macOS app and DMG
        env:
          # Cùng khoá với Windows: tạo UTD.app.tar.gz + .sig cho tự cập nhật.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg \
            --config "$GITHUB_WORKSPACE/src-tauri/tauri.updater.conf.json"

      # Gói cập nhật Tauri đặt tên UTD.app.tar.gz (không có số phiên bản): đổi tên khi đăng cho khỏi lẫn.
      - name: Collect macOS files
        run: |
          shopt -s nullglob
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          dmgs=("$BUNDLE_DIR"/dmg/*.dmg)
          archives=("$BUNDLE_DIR"/macos/*.app.tar.gz)
          if [ ${#dmgs[@]} -ne 1 ] || [ ${#archives[@]} -ne 1 ]; then
            echo "::error::Cần đúng 1 file .dmg và 1 file .app.tar.gz, thấy ${#dmgs[@]} và ${#archives[@]}"
            exit 1
          fi
          if [ ! -f "${archives[0]}.sig" ]; then
            echo "::error::Không thấy ${archives[0]}.sig: gói macOS chưa được ký cho tự cập nhật"
            exit 1
          fi
          codesign --verify --deep --strict "$BUNDLE_DIR/macos/UTD.app"
          mkdir -p "$OUT_DIR"
          cp "${dmgs[0]}" "$OUT_DIR/"
          cp "${archives[0]}" "$OUT_DIR/UTD_${version}_universal.app.tar.gz"
          cp "${archives[0]}.sig" "$OUT_DIR/UTD_${version}_universal.app.tar.gz.sig"
          ls -l "$OUT_DIR"

      - uses: actions/upload-artifact@v7
        with:
          name: build-macos
          path: ${{ env.OUT_DIR }}/
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_DIR: release-files
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: ${{ env.RELEASE_DIR }}
          merge-multiple: true

      # latest.json: app đọc ở releases/latest/download/latest.json (chỉ sau khi bấm Publish).
      # Một bản universal phục vụ cả Mac chip Apple (darwin-aarch64) và Mac Intel (darwin-x86_64).
      # Ghi chú hiện trong app lấy từ docs/releases/<tag>.md nếu có.
      - name: Write latest.json
        run: |
          shopt -s nullglob
          installers=("$RELEASE_DIR"/*-setup.exe)
          archives=("$RELEASE_DIR"/*.app.tar.gz)
          if [ ${#installers[@]} -ne 1 ] || [ ${#archives[@]} -ne 1 ]; then
            echo "::error::Cần đúng 1 bộ cài Windows và 1 gói macOS, thấy ${#installers[@]} và ${#archives[@]}"
            exit 1
          fi
          node scripts/release/latest-json.mjs \
            --asset "windows-x86_64=${installers[0]}" \
            --asset "darwin-aarch64=${archives[0]}" \
            --asset "darwin-x86_64=${archives[0]}" \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --out "$RELEASE_DIR/latest.json"
          ls -l "$RELEASE_DIR"

      # Tổng SHA-256 của mọi file sẽ đăng (định dạng `sha256sum -c` đọc được).
      - name: Write SHA256SUMS.txt
        working-directory: ${{ env.RELEASE_DIR }}
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const lines = fs.readdirSync(".").filter((name) => name !== "SHA256SUMS.txt").sort()
              .map((name) => crypto.createHash("sha256").update(fs.readFileSync(name)).digest("hex") + "  " + name);
            fs.writeFileSync("SHA256SUMS.txt", lines.join("\n") + "\n");
          '
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: utd-${{ github.ref_name }}
          path: ${{ env.RELEASE_DIR }}/
          if-no-files-found: error

      # Bản nháp: chủ dự án đọc lại rồi tự bấm Publish trên GitHub. Chạy lại job chỉ ghi đè file của bản còn nháp
      # (giữ nguyên ghi chú đã sửa tay). Ghi chú lấy từ docs/releases/<tag>.md; không có thì GitHub tự liệt kê commit.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Bản $tag đã phát hành, không ghi đè file"
              exit 1
            fi
            gh release upload "$tag" "$RELEASE_DIR"/* --clobber
          else
            notes=(--generate-notes)
            if [ -s "docs/releases/$tag.md" ]; then
              notes=(--notes-file "docs/releases/$tag.md")
            fi
            gh release create "$tag" "$RELEASE_DIR"/* --draft --verify-tag --title "UTD $tag" "${notes[@]}"
          fi
