[package]
name = "app"
# Phiên bản, edition, giấy phép lấy từ [workspace.package] ở Cargo.toml gốc (đổi bản: docs/RELEASE.md).
version.workspace = true
description = "UTD desktop app: open-source download manager for Windows and macOS"
authors = ["UTD contributors"]
license.workspace = true
repository = "https://github.com/1Scout-Co/UTD"
homepage = "https://github.com/1Scout-Co/UTD"
edition.workspace = true
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
utd-engine = { path = "../crates/utd-engine" }
# Ghép fMP4 → MP4 bằng Rust (nhanh hơn ffmpeg nhiều lần), ffmpeg làm đường lui: src/media/output.rs.
utd-mp4 = { path = "../crates/utd-mp4" }
tokio = { version = "1.54.1", features = ["io-util", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
fs2 = "0.4.3"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-dialog = "2.8.3"
# Tự cập nhật có chữ ký (src/updater.rs). Dùng native-tls như engine: không kéo thêm rustls/zip.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["native-tls"] }
# Icon file → PNG data URL (src/files/icons.rs). Cả hai đã có sẵn trong Cargo.lock.
png = "0.18.1"
base64 = "0.22.1"

[dev-dependencies]
# Bài thử tải công cụ với server giả (src/media/install_tests.rs): tính SHA-256 file mẫu. Đã có trong Cargo.lock (engine dùng).
sha2 = "0.11.1"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
# Thao tác file như Explorer (src/files): mở, chọn trong thư mục, Thùng rác, icon thật.
# Của Microsoft, bản đã có trong Cargo.lock; windows-core cần cho #[implement] (COM sink).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

# errno, statvfs, renamex_np, getxattr (src/files/disk.rs, browser_integration/mac.rs).
[target."cfg(unix)".dependencies]
libc = "0.2.191"

# Finder/Thùng rác/icon thật trên macOS (src/files/shell/mac.rs, src/files/icons/mac.rs).
# Cùng bản Tauri đang dùng (đã có trong Cargo.lock); chỉ bật lớp cần dùng.
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSWorkspace",
] }
