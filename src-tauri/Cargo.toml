[package]
name = "app"
# Phiên bản, edition, giấy phép lấy từ [workspace.package] ở Cargo.toml gốc (đổi bản: docs/RELEASE.md).
version.workspace = true
description = "UTD desktop app: open-source download manager for Windows"
authors = ["UTD contributors"]
license.workspace = true
repository = "https://github.com/1Scout-Co/UTD"
homepage = "https://github.com/1Scout-Co/UTD"
edition.workspace = true
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
utd-engine = { path = "../crates/utd-engine" }
# Ghép fMP4 → MP4 bằng Rust (nhanh hơn ffmpeg nhiều lần), ffmpeg làm đường lui: src/media/output.rs.
utd-mp4 = { path = "../crates/utd-mp4" }
tokio = { version = "1.54.1", features = ["io-util", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
fs2 = "0.4.3"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-dialog = "2.8.3"
# Tự cập nhật có chữ ký (src/updater.rs). Dùng native-tls như engine: không kéo thêm rustls/zip.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["native-tls"] }
# Icon file → PNG data URL (src/files/icons.rs). Cả hai đã có sẵn trong Cargo.lock.
png = "0.18.1"
base64 = "0.22.1"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
# Thao tác file như Explorer (src/files): mở, chọn trong thư mục, Thùng rác, icon thật.
# Của Microsoft, bản đã có trong Cargo.lock; windows-core cần cho #[implement] (COM sink).
# Win32_UI_HiDpi, Win32_UI_Input_KeyboardAndMouse: nút cửa sổ tự vẽ (src/titlebar/caption.rs); tao đã bật sẵn cả hai.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
