<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UTD</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #0f1b2d;
        --muted: #52647a;
        --primary: #006bd6;
        --line: #e5edf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        color: var(--ink);
        background: #f6faff;
        font:
          13px/1.5 Inter,
          system-ui,
          sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 5px;
        margin-bottom: 12px;
      }
      strong {
        font-size: 19px;
        letter-spacing: -0.04em;
      }
      span {
        color: var(--muted);
      }
      button {
        width: 100%;
        height: 34px;
        border: 0;
        border-radius: 9px;
        color: #fff;
        background: var(--primary);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 11.5px;
      }
      .ok {
        color: #0a7a4b;
      }
      .error {
        color: #b42318;
      }
      .card {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      .card + .card {
        margin-top: 8px;
      }
      .site {
        margin: 0 0 8px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      button.secondary {
        color: var(--primary);
        background: #e8f1fc;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
      }
      details {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      summary {
        cursor: pointer;
      }
      details input {
        width: 76px;
        margin-inline-start: auto;
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header><strong>utd</strong><span>desktop</span></header>
    <!-- S-70 / S-71: trang đang mở có việc chờ đăng nhập, hoặc bật/tắt đăng nhập cho trang. -->
    <div class="card" id="auth" data-s="S-70" hidden>
      <p class="site" id="auth-site"></p>
      <button id="auth-use" type="button" hidden></button>
      <label><input id="auth-switch" type="checkbox" /><span data-i18n="authSiteSwitch">Sign-in on this site</span></label>
      <p id="auth-status"></p>
    </div>
    <div class="card">
      <button id="send" type="button" data-i18n="sendPage">Download this page with UTD</button>
      <p id="status" data-i18n="hint">Right-click a link or video to download it quickly.</p>
      <label><input id="video-switch" type="checkbox" checked /><span data-i18n="videoButtonSwitch">Show the "Download this video" button</span></label>
    </div>
    <!-- S-76: tự bắt link tải của trình duyệt (takeover.js), mặc định bật. -->
    <div class="card" id="takeover" data-s="S-76">
      <label><input id="takeover-switch" type="checkbox" checked /><span data-i18n="takeoverSwitch">Catch browser downloads</span></label>
      <details>
        <summary data-i18n="takeoverMore">Options</summary>
        <label><span data-i18n="takeoverMinSize">Skip files smaller than (MB)</span><input id="takeover-min" type="number" min="0" step="0.5" /></label>
        <label><span data-i18n="takeoverSkipTypes">Don't catch these types</span><input id="takeover-skip" type="text" placeholder="torrent, ics" /></label>
      </details>
      <p data-i18n="takeoverHint">Hold Alt while clicking to let the browser download it.</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
