[package]
name = "utd-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Download, verification and diagnostics engine for UTD"

[dependencies]
httpdate = "1.0.3"
log = "0.4"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

# Cờ quarantine của macOS (safety::mark_of_the_web) qua setxattr; bản đã có sẵn trong Cargo.lock.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
